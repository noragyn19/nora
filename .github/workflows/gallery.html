  <h1>OTHERS PEAK IN IGBARAS</h1>
  <p>A glimpse of the landscapes, trails, and beauty of nature.</p>
</header>

<main class="gallery">
  <figure>
      <img src="pulang lupa.jpg" alt="Mountain peaks">
      <div><h2>MT.PULANG LUPA</h2>
      <p>Mt. Pulang Lupa (also called Lupa Pula) is a scenic hiking and camping destination located in Sitio Butuan, Barangay Igcabugao, Igbaras, Iloilo, straddling the border with Tubungan.</p>
    </a></div>
  </figure>

  <figure>
      <img src="guiritsan.jpg" alt="Hiking trail">
      <div><h2>GUIRITSAN FALLS</h2>
      <p> Situated 14 kilometers from the town proper, this cave features eerie, massive, church-sized chambers adorned with sparkling stalactites and stalagmites. Visitors can swim in its freezing underground river and explore its network of subterranean basins.</p></div>
    </a>
  </figure>

  <figure>
      <img src="nadsadjan.jpg" alt="Camping in nature">
      <div><h2>NADSADJAN FALLS</h2>
      <p>Nadsadjan Falls drops approximately 100 feet into a large, cold, cauldron-shaped natural basin.</p></div>
    </a>
  </figure>

  <figure>
      <img src="igcabugao.jpg" alt="Green mountain scenery">
      <div><h2>IGCABUGAO CAVE</h2>
      <p> It features a massive, church-sized interior chamber with eerie and immense rock formations.</p></div>
    </a>
  </figure>

  <figure>
      <img src="iglibog.jpg" alt="Wildlife and nature">
      <div><h2>IGLIBOG FALLS</h2>
      <p>Iglibog Falls is a scenic 20-foot waterfall tucked inside a cave-like rock formation in Barangay Igcabugao, Igbaras, Iloilo, Philippines.</p></div>
    </a>
  </figure>

  <figure>
      <img src="raflesia.jpg" alt="Panoramic mountain valley">
      <div><h2>RAFFLESIA GARDEN</h2>
      <p>Rafflesia—the world's largest parasitic corpse flower. Tourists time their visits during blooming seasons to witness this exotic and giant botanical marvel.</p></div>
    </a>
  </figure>
